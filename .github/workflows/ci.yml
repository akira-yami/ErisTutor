name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

# Must run on Windows: the runtime uses msvcrt, tasklist and CREATE_NO_WINDOW,
# which do not exist on Linux runners.
jobs:
  foundation:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src

      - name: Import smoke test (foundation)
        run: python smoke_foundation.py

      - name: Import smoke test (memory)
        run: |
          if (Test-Path smoke_memory.py) { python smoke_memory.py }

      - name: Unit tests
        run: pytest -q
