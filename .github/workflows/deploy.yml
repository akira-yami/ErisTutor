name: AWS Cloud Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-aws:
    name: Build & Verify Eris Cloud Rich Chat Container
    runs-on: ubuntu-latest
    environment:
      name: aws-production
      url: https://aws.amazon.com/
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Cloud Rich Chat Container
        run: |
          echo "Building lightweight Eris Rich Chat image..."
          docker build -t eris-richchat-cloud:latest .

      - name: Test Container Health & State API
        run: |
          echo "Starting container for smoke test..."
          docker run -d --name test-eris -p 8080:8080 -e PORT=8080 eris-richchat-cloud:latest
          sleep 3
          curl -f http://127.0.0.1:8080/api/state || exit 1
          echo "Health check passed: HTTP 200 OK"
          docker stop test-eris

      - name: Summary
        run: |
          echo "=================================================="
          echo "STATUS: 🟢 CLOUD CONTAINER READY FOR AWS"
          echo "SERVICE: Eris Rich Chat Studio & Inner Thought AI"
          echo "DOCKER IMAGE: eris-richchat-cloud:latest"
          echo "=================================================="
