spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eristutor}
    username: ${DB_USERNAME:eristutor}
    password: ${DB_PASSWORD:eristutor}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eristutor:
  rate-limit:
    backend: ${ERIS_RATE_LIMIT_BACKEND:redis}
