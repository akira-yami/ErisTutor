spring:
  datasource:
    url: jdbc:h2:mem:eristutor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

management:
  health:
    redis:
      enabled: false

eristutor:
  rate-limit:
    backend: memory
