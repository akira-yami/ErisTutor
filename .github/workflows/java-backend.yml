name: Java Backend CI

on:
  push:
    paths:
      - "backend-java/**"
      - ".github/workflows/java-backend.yml"
  pull_request:
    paths:
      - "backend-java/**"
      - ".github/workflows/java-backend.yml"

jobs:
  test-java-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25/27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build & Run Unit + Integration + Testcontainers Tests
        working-directory: backend-java
        run: mvn -B test -Dmaven.compiler.release=25
